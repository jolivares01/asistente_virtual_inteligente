version: '3.8'

services:
  # Backend FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: helpdesk-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway" 
    networks:
      - helpdesk-network

  # Frontend Vue.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: helpdesk-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - helpdesk-network

networks:
  helpdesk-network:
    driver: bridge